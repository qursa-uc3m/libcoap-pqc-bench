#**************************************************************************
# MQTT-SN Gateway Configuration for PQC Benchmarking
# This template is managed by libcoap-pqc-bench
# Certificate paths are dynamically updated by mqttsn_benchmark_server.sh
#**************************************************************************

# Gateway identification
GatewayID=1
GatewayName=MQTTSN-PQC-Gateway
MaxNumberOfClients=300
KeepAlive=60

#**************************************************************************
# Broker Configuration (for aggregating/transparent mode)
# Set to localhost for local Mosquitto broker
#**************************************************************************
BrokerName=localhost
BrokerPortNo=1883
BrokerSecurePortNo=8883

#**************************************************************************
# MQTT-SN Network Configuration
#**************************************************************************
GatewayPortNo=10000
MulticastPortNo=1883

# IPv6 configuration
GatewayIPv6PortNo=10000
MulticastIPv6PortNo=1883

#**************************************************************************
# DTLS Security Configuration
# These paths are dynamically updated by mqttsn_benchmark_server.sh
# based on the -cert-config parameter
#**************************************************************************

# Server certificate and key
DtlsCertsKey=/path/to/server_cert.pem
DtlsPrivKey=/path/to/server_key.pem

# CA certificate for client verification (optional)
DtlsCACertFile=/path/to/ca_cert.pem

#**************************************************************************
# Logging
#**************************************************************************
# LogFile=./gateway.log

#**************************************************************************
# Pre-defined Topics (optional)
#**************************************************************************
# PredefinedTopicFile=./predefinedTopic.conf
