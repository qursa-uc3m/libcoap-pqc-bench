#**************************************************************************
# MQTT-SN Gateway Configuration for PQC Benchmarking
# Managed by libcoap-pqc-bench
#
# This file is a template copied into the gateway's bin/ at install time.
# At runtime, benchmark/mqttsn_benchmark_server.sh renders a per-run
# gateway.conf under benchmark/data/current/ and starts the gateway with:
#   ./MQTT-SNGateway -f <rendered-config>
#
# Keep this file compatible with upstream Paho gateway.conf keys.
#**************************************************************************

GatewayID=1
GatewayName=MQTTSN-PQC-Gateway
MaxNumberOfClients=300
KeepAlive=2

# Broker (default: public broker to avoid local Mosquitto)
BrokerName=mqtt.eclipseprojects.io
BrokerPortNo=1883
BrokerSecurePortNo=8883

# Behavior
AggregatingGateway=NO
QoS-1=NO
Forwarder=NO
PredefinedTopic=NO
ClientAuthentication=NO

# Client list (not required when ClientAuthentication=NO, but the benchmark
# still writes it to keep configs self-contained)
ClientsList=/tmp/clients.conf

# SensorNetwork
GatewayPortNo=10000
MulticastPortNo=1883
MulticastIP=225.1.1.1
MulticastTTL=1

GatewayIPv6PortNo=10000
MulticastIPv6PortNo=1883

# DTLS server credentials (filled in at runtime)
# Keep relative paths (from MQTTSNGateway/bin) like upstream:
DtlsCertsKey=../../certs/dtls.crt
DtlsPrivKey=../../certs/dtls.key
#DtlsCertsKey=../../certs/dilithium/dilithium3_entity_cert.pem
#DtlsPrivKey=../../certs/dilithium/dilithium3_entity_key.pem

# LOG
ShearedMemory=NO
